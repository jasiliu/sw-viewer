<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>3D展示空間</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #f0f0f0;
    }

    #loading {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(60, 60, 60, 0.85);
      color: #fff;
      padding: 14px 18px;
      border-radius: 12px;
      z-index: 10;
      font-size: 16px;
      line-height: 1.5;
      max-width: 420px;
      white-space: pre-line;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>

<div id="loading">模型載入中...</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';
import { GLTFLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

const loadingBox = document.getElementById("loading");

let scene, camera, renderer, controls;

init();
animate();

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf0f0f0);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200000);
  camera.position.set(3000, 2000, 3000);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  document.body.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  const hemiLight = new THREE.HemisphereLight(0xffffff, 0x888888, 1.2);
  scene.add(hemiLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
  dirLight.position.set(2000, 3000, 2000);
  scene.add(dirLight);

  const grid = new THREE.GridHelper(10000, 50);
  scene.add(grid);

  const axes = new THREE.AxesHelper(1000);
  scene.add(axes);

  const loader = new GLTFLoader();

  const modelPath = "./model.glb";
  loadingBox.textContent = "模型載入中...\n" + modelPath;

  loader.load(
    modelPath,
    function (gltf) {
      const model = gltf.scene;
      scene.add(model);

      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());

      model.position.x -= center.x;
      model.position.y -= box.min.y;
      model.position.z -= center.z;

      const maxDim = Math.max(size.x, size.y, size.z);
      const distance = Math.max(maxDim * 1.5, 1000);

      camera.position.set(distance, distance * 0.6, distance);
      controls.target.set(0, Math.max(size.y * 0.3, 0), 0);
      controls.update();

      loadingBox.textContent = "模型載入完成";
      setTimeout(() => {
        loadingBox.style.display = "none";
      }, 1200);
    },
    function (xhr) {
      if (xhr.total) {
        const percent = (xhr.loaded / xhr.total * 100).toFixed(1);
        loadingBox.textContent = `模型載入中...\n${percent}%`;
      } else {
        loadingBox.textContent = `模型載入中...\n已接收 ${xhr.loaded} bytes`;
      }
    },
    function (error) {
      console.error("GLB 載入失敗:", error);
      loadingBox.textContent =
        "模型載入失敗\n\n" +
        "請檢查：\n" +
        "1. repo 裡是否真的有 model.glb\n" +
        "2. 檔名大小寫是否完全一致\n" +
        "3. model.glb 是否損壞\n" +
        "4. GitHub Pages 是否已更新\n\n" +
        "請按 F12 看 Console 錯誤";
    }
  );

  window.addEventListener('resize', onWindowResize);
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
</script>

</body>
</html>
