<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>總部大樓 3D 客戶檢視版</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .hero {
      background: linear-gradient(135deg, #2f6fed, #5f8fff);
      color: white;
      text-align: center;
      padding: 60px 20px 50px;
    }

    .hero h1 {
      margin: 0 0 12px 0;
      font-size: 34px;
    }

    .hero p {
      margin: 0;
      font-size: 18px;
      opacity: 0.95;
    }

    .wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 30px 20px 50px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      margin-bottom: 24px;
    }

    .card h2 {
      margin-top: 0;
      font-size: 24px;
      text-align: center;
    }

    .card p {
      line-height: 1.8;
      color: #444;
      text-align: center;
    }

    .preview {
      text-align: center;
    }

    .preview img {
      max-width: 100%;
      border-radius: 12px;
      border: 1px solid #ddd;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }

    .download-area {
      text-align: center;
      margin-top: 24px;
    }

    .download-btn {
      display: inline-block;
      padding: 14px 26px;
      background: #2f6fed;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    .download-btn:hover {
      background: #1e4fc2;
    }

    .note {
      margin-top: 14px;
      font-size: 14px;
      color: #777;
      text-align: center;
    }

    .steps {
      max-width: 620px;
      margin: 0 auto;
      line-height: 1.8;
      color: #444;
    }

    footer {
      text-align: center;
      color: #777;
      font-size: 13px;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="hero">
    <h1>總部大樓 3D 客戶檢視版</h1>
    <p>提供客戶下載與查看 3D 模型檢視檔</p>
  </div>

  <div class="wrap">
    <div class="card">
      <h2>模型預覽</h2>
      <p>以下為本次提供之 3D 模型預覽畫面</p>
      <div class="preview">
        <img src="cover.jpg" alt="總部大樓 3D 預覽圖">
      </div>
    </div>

    <div class="card">
      <h2>下載 3D 檢視檔</h2>
      <p>
        點擊下方按鈕下載 ZIP 檔。<br>
        下載後解壓縮，即可開啟 3D 檢視檔。
      </p>

      <div class="download-area">
        <a class="download-btn"
           href="https://github.com/jasiliu/sw-viewer/releases/latest/download/0329-1_64.exe"
           target="_blank">
          下載 3D 檢視檔
        </a>
      </div>

      <div class="note">
        建議使用 Windows 10 / 11
      </div>
    </div>

    <div class="card">
      <h2>使用步驟</h2>
      <div class="steps">
        1. 點擊「下載 3D 檢視檔」<br>
        2. 下載完成後解壓縮 ZIP<br>
        3. 開啟檢視程式或檔案<br>
        4. 使用滑鼠旋轉、平移、縮放查看模型
      </div>
    </div>
  </div>

  <footer>
    © 3D 客戶檢視頁
  </footer>
</body>
</html>
