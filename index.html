<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>3D展示空間 - 多模型切換版</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #f0f0f0;
    }

    canvas {
      display: block;
    }

    #status {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 20;
      background: rgba(40, 40, 40, 0.88);
      color: #fff;
      padding: 14px 16px;
      border-radius: 12px;
      max-width: 420px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.2);
    }

    #panel {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 20;
      background: rgba(255, 255, 255, 0.95);
      color: #222;
      padding: 14px;
      border-radius: 12px;
      min-width: 220px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.18);
    }

    #panel h3 {
      margin: 0 0 10px 0;
      font-size: 16px;
    }

    .model-btn {
      display: block;
      width: 100%;
      margin: 6px 0;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      background: #e9ecef;
      cursor: pointer;
      text-align: left;
      font-size: 14px;
      transition: 0.2s;
    }

    .model-btn:hover {
      background: #dfe3e6;
    }

    .model-btn.active {
      background: #2f6fed;
      color: #fff;
    }

    .small-note {
      margin-top: 10px;
      font-size: 12px;
      color: #666;
      line-height: 1.4;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="status">初始化中...</div>

  <div id="panel">
    <h3>模型切換</h3>
    <div id="buttonContainer"></div>
    <div class="small-note">
      點擊按鈕即可切換模型
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    const statusBox = document.getElementById("status");
    const buttonContainer = document.getElementById("buttonContainer");

    function setStatus(msg) {
      statusBox.textContent = msg;
      console.log(msg);
    }

    function appendStatus(msg) {
      statusBox.textContent += "\n" + msg;
      console.log(msg);
    }

    const MODEL_LIST = [
      { name: "案場 A", file: "./model_a.glb" },
      { name: "案場 B", file: "./model_b.glb" },
      { name: "案場 C", file: "./model_c.glb" }
    ];

    let scene, camera, renderer, controls;
    let loader, dracoLoader;
    let currentModel = null;
    let currentButtons = [];
    let grid, axes;

    init();
    createButtons();
    loadModel(MODEL_LIST[0], 0);
    animate();

    function init() {
      setStatus("Three.js 模組載入成功");

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xf0f0f0);

      camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        200000
      );
      camera.position.set(3000, 2000, 3000);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      document.body.appendChild(renderer.domElement);
      appendStatus("Renderer 建立成功");

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.screenSpacePanning = true;
      controls.minDistance = 1;
      controls.maxDistance = 200000;
      appendStatus("OrbitControls 建立成功");

      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x888888, 1.2);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight.position.set(2000, 3000, 2000);
      scene.add(dirLight);

      grid = new THREE.GridHelper(10000, 50);
      scene.add(grid);

      axes = new THREE.AxesHelper(1000);
      scene.add(axes);

      loader = new GLTFLoader();
      dracoLoader = new DRACOLoader();
      dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');
      loader.setDRACOLoader(dracoLoader);

      window.addEventListener("resize", onWindowResize);
    }

    function createButtons() {
      buttonContainer.innerHTML = "";
      currentButtons = [];

      MODEL_LIST.forEach((item, index) => {
        const btn = document.createElement("button");
        btn.className = "model-btn";
        btn.textContent = item.name;
        btn.addEventListener("click", () => {
          loadModel(item, index);
        });
        buttonContainer.appendChild(btn);
        currentButtons.push(btn);
      });
    }

    function setActiveButton(index) {
      currentButtons.forEach((btn, i) => {
        if (i === index) {
          btn.classList.add("active");
        } else {
          btn.classList.remove("active");
        }
      });
    }

    function clearCurrentModel() {
      if (!currentModel) return;

      scene.remove(currentModel);

      currentModel.traverse((obj) => {
        if (obj.isMesh) {
          if (obj.geometry) obj.geometry.dispose();

          if (obj.material) {
            if (Array.isArray(obj.material)) {
              obj.material.forEach((mat) => disposeMaterial(mat));
            } else {
              disposeMaterial(obj.material);
            }
          }
        }
      });

      currentModel = null;
    }

    function disposeMaterial(material) {
      if (!material) return;

      for (const key in material) {
        const value = material[key];
        if (value && typeof value === "object" && "minFilter" in value) {
          value.dispose?.();
        }
      }
      material.dispose?.();
    }

    function loadModel(modelItem, buttonIndex) {
      setActiveButton(buttonIndex);
      setStatus(`準備載入模型...\n${modelItem.name}\n${modelItem.file}`);

      clearCurrentModel();

      loader.load(
        modelItem.file,

        function (gltf) {
          const model = gltf.scene;
          currentModel = model;
          scene.add(model);

          const box = new THREE.Box3().setFromObject(model);
          const center = box.getCenter(new THREE.Vector3());
          const size = box.getSize(new THREE.Vector3());

          model.position.x -= center.x;
          model.position.y -= box.min.y;
          model.position.z -= center.z;

          const maxDim = Math.max(size.x, size.y, size.z);
          const distance = Math.max(maxDim * 1.5, 1000);

          camera.position.set(distance, distance * 0.6, distance);
          controls.target.set(0, Math.max(size.y * 0.3, 0), 0);
          controls.update();

          setStatus(
            `模型載入完成\n` +
            `名稱: ${modelItem.name}\n` +
            `尺寸 x=${size.x.toFixed(2)} y=${size.y.toFixed(2)} z=${size.z.toFixed(2)}`
          );

          setTimeout(() => {
            statusBox.style.display = "none";
          }, 1400);
        },

        function (xhr) {
          statusBox.style.display = "block";

          if (xhr.total) {
            const percent = (xhr.loaded / xhr.total * 100).toFixed(1);
            setStatus(
              `模型載入中...\n` +
              `名稱: ${modelItem.name}\n` +
              `${percent}%`
            );
          } else {
            setStatus(
              `模型載入中...\n` +
              `名稱: ${modelItem.name}\n` +
              `已接收 ${xhr.loaded} bytes`
            );
          }
        },

        function (error) {
          console.error(error);
          setStatus(
            `模型載入失敗\n\n` +
            `名稱: ${modelItem.name}\n` +
            `檔案: ${modelItem.file}\n\n` +
            `請檢查：\n` +
            `1. 檔案是否存在\n` +
            `2. 檔名大小寫是否一致\n` +
            `3. GLB 是否損壞\n` +
            `4. Draco 解碼器是否可連線`
          );
        }
      );
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
