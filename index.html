<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>3D 模型檢視 - STL 版</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #f0f0f0;
    }

    canvas {
      display: block;
    }

    #status {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 20;
      background: rgba(40, 40, 40, 0.88);
      color: #fff;
      padding: 14px 16px;
      border-radius: 12px;
      max-width: 420px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.2);
    }

    #panel {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 20;
      background: rgba(255, 255, 255, 0.96);
      color: #222;
      padding: 14px;
      border-radius: 12px;
      min-width: 220px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.18);
    }

    #panel h3 {
      margin: 0 0 10px 0;
      font-size: 16px;
    }

    .view-btn {
      display: block;
      width: 100%;
      margin: 6px 0;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      background: #e9ecef;
      cursor: pointer;
      text-align: left;
      font-size: 14px;
    }

    .view-btn:hover {
      background: #dfe3e6;
    }

    .small-note {
      margin-top: 10px;
      font-size: 12px;
      color: #666;
      line-height: 1.4;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="status">初始化中...</div>

  <div id="panel">
    <h3>視角控制</h3>
    <button class="view-btn" id="btnFront">正視圖</button>
    <button class="view-btn" id="btnTop">俯視圖</button>
    <button class="view-btn" id="btnIso">等角視圖</button>
    <button class="view-btn" id="btnFit">回到模型</button>

    <div class="small-note">
      目前為 STL 展示版<br>
      檔名請固定為 0329-1.stl
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { STLLoader } from 'three/addons/loaders/STLLoader.js';

    const statusBox = document.getElementById("status");
    const btnFront = document.getElementById("btnFront");
    const btnTop = document.getElementById("btnTop");
    const btnIso = document.getElementById("btnIso");
    const btnFit = document.getElementById("btnFit");

    function setStatus(msg) {
      statusBox.textContent = msg;
      console.log(msg);
    }

    const CACHE_BUSTER = "v=20260331stl1";
    const MODEL_FILE = "./model.stl?" + CACHE_BUSTER;

    let scene, camera, renderer, controls;
    let currentMesh = null;

    let lastCenter = new THREE.Vector3(0, 0, 0);
    let lastSize = new THREE.Vector3(1000, 1000, 1000);
    let lastDistance = 1000;

    init();
    loadSTL();
    bindViewButtons();
    animate();

    function init() {
      setStatus("Three.js 載入成功");

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xf0f0f0);

      camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        200000
      );
      camera.position.set(3000, 2000, 3000);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      document.body.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.screenSpacePanning = true;
      controls.minDistance = 1;
      controls.maxDistance = 200000;

      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x888888, 1.2);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight.position.set(2000, 3000, 2000);
      scene.add(dirLight);

      const grid = new THREE.GridHelper(10000, 50);
      scene.add(grid);

      const axes = new THREE.AxesHelper(1000);
      scene.add(axes);

      window.addEventListener("resize", onWindowResize);
    }

    function loadSTL() {
      setStatus("準備載入 STL...\n" + MODEL_FILE);

      const loader = new STLLoader();

      loader.load(
        MODEL_FILE,
        function (geometry) {
          if (currentMesh) {
            scene.remove(currentMesh);
            currentMesh.geometry.dispose();
            currentMesh.material.dispose();
            currentMesh = null;
          }

          geometry.computeVertexNormals();

          const material = new THREE.MeshStandardMaterial({
            color: 0xb0b0b0,
            metalness: 0.15,
            roughness: 0.75
          });

          const mesh = new THREE.Mesh(geometry, material);
          currentMesh = mesh;
          scene.add(mesh);

          geometry.computeBoundingBox();
          const box = geometry.boundingBox;

          const size = new THREE.Vector3();
          box.getSize(size);

          const center = new THREE.Vector3();
          box.getCenter(center);

          mesh.position.x -= center.x;
          mesh.position.y -= box.min.y;
          mesh.position.z -= center.z;

          lastCenter = new THREE.Vector3(0, size.y * 0.3, 0);
          lastSize = size.clone();

          const maxDim = Math.max(size.x, size.y, size.z);
          lastDistance = Math.max(maxDim * 1.5, 1000);

          fitModel();

          setStatus(
            "STL 載入完成\n" +
            "檔案: " + MODEL_FILE + "\n" +
            "尺寸 x=" + size.x.toFixed(2) +
            " y=" + size.y.toFixed(2) +
            " z=" + size.z.toFixed(2)
          );

          setTimeout(() => {
            statusBox.style.display = "none";
          }, 1200);
        },
        function (xhr) {
          statusBox.style.display = "block";
          if (xhr.total) {
            const percent = (xhr.loaded / xhr.total * 100).toFixed(1);
            setStatus("STL 載入中...\n" + percent + "%");
          } else {
            setStatus("STL 載入中...\n已接收 " + xhr.loaded + " bytes");
          }
        },
        function (error) {
          console.error(error);
          setStatus(
            "STL 載入失敗\n\n" +
            "請檢查：\n" +
            "1. model.stl 是否存在\n" +
            "2. 檔名大小寫是否一致\n" +
            "3. STL 是否損壞"
          );
        }
      );
    }

    function fitModel() {
      camera.position.set(lastDistance, lastDistance * 0.6, lastDistance);
      controls.target.copy(lastCenter);
      controls.update();
    }

    function setFrontView() {
      const d = Math.max(lastDistance, lastSize.x, lastSize.y, lastSize.z) * 1.1;
      camera.position.set(0, lastSize.y * 0.15, d);
      controls.target.copy(lastCenter);
      controls.update();
      showTempStatus("已切換到正視圖");
    }

    function setTopView() {
      const d = Math.max(lastDistance, lastSize.x, lastSize.z) * 1.2;
      camera.position.set(0, d, 0.001);
      controls.target.copy(lastCenter);
      controls.update();
      showTempStatus("已切換到俯視圖");
    }

    function setIsoView() {
      camera.position.set(lastDistance, lastDistance * 0.6, lastDistance);
      controls.target.copy(lastCenter);
      controls.update();
      showTempStatus("已切換到等角視圖");
    }

    function showTempStatus(msg) {
      statusBox.style.display = "block";
      setStatus(msg);
      setTimeout(() => {
        statusBox.style.display = "none";
      }, 900);
    }

    function bindViewButtons() {
      btnFront.addEventListener("click", setFrontView);
      btnTop.addEventListener("click", setTopView);
      btnIso.addEventListener("click", setIsoView);
      btnFit.addEventListener("click", fitModel);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
